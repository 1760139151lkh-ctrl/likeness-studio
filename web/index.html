<!doctype html>
<html lang="zh-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* 软键盘只缩可见区、不缩布局（安卓 Chrome / Firefox 要这样写明）。Safari 本来就是这样，但不认识这个写法、会在控制台报一条错，所以不给它加。 */
  if (navigator.vendor !== 'Apple Computer, Inc.') document.querySelector('meta[name="viewport"]').content += ', interactive-widget=resizes-visual';
</script>
<meta name="theme-color" content="#0d0a1a">
<meta name="color-scheme" content="light dark">
<title>哈基秀 · 一张自拍，秒变艺术头像</title>
<meta name="description" content="实时变身 + 上传精修：梦幻公主、丹青仙袂、特摄英雄、娘惹风华、赛博霓虹…33 种风格，还能部位精修、对话微调，一键做出惊艳全场的艺术头像。">
<!-- studio-state -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script>
  /* 先把上次的风格主题刷上去，刷新时不闪默认色。 */
  try {
    const last = JSON.parse(localStorage.getItem('hjx.theme') || 'null');
    if (last) { for (const [k, v] of Object.entries(last.vars)) document.documentElement.style.setProperty(k, v); Object.assign(document.documentElement.dataset, last.data); }
  } catch { /* 第一次来 */ }
</script>
</head>
<body>
<main class="stage" id="stage">
  <div class="ambience" aria-hidden="true"><img alt=""><img alt=""></div>
  <div class="stage__deco" aria-hidden="true"></div>
  <div class="screens"></div>
  <div class="boot" aria-hidden="true"><span class="boot__mark">哈基秀</span><span class="boot__line">一张自拍，秒变艺术头像</span></div>
</main>
<aside class="desk-note" aria-hidden="true"><b>哈基秀</b><span>一张自拍，秒变艺术头像</span><span class="desk-note__tip">为手机竖屏设计 · 9:16</span></aside>
<noscript><p style="padding:2rem;font-family:system-ui">哈基秀需要开启 JavaScript。</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
